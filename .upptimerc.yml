# The Agōn status page (status.agon1230.com): Upptime, running on GitHub Actions in the public repo msentell/agon-status.
# This is the source copy. Paste it over .upptimerc.yml in that repo (docs/RUNBOOK.md, "Set up the status page").
# A check is down when the response isn't 2xx: /healthz/scheduler answers 503 once the 5-minute tick has stalled.
owner: msentell
repo: agon-status

sites:
  - name: agon1230.com
    url: https://agon1230.com/
  - name: Server and database
    url: https://agon1230.com/healthz
  - name: Scheduler (prompts, fines, billing)
    url: https://agon1230.com/healthz/scheduler
  - name: Agōn API
    url: https://agon1230.com/v1/openapi.json

# Who's assigned the GitHub issue opened for each outage (GitHub emails him).
assignees:
  - msentell

status-website:
  cname: status.agon1230.com
  name: Agōn status
  introTitle: "Is Agōn up?"
  introMessage: "Live status for agon1230.com, the Agōn app, and the scheduler that sends evening prompts. If Agōn is down in the hours before a 9am deadline, that day stays open until three hours after it's back, for everyone, automatically."
  logoUrl: https://agon1230.com/assets/mark.svg
  favicon: https://agon1230.com/assets/favicon-32.png
  navbar:
    - title: Status
      href: /
    - title: agon1230.com
      href: https://agon1230.com/
    - title: Under the hood
      href: https://agon1230.com/under-the-hood/
